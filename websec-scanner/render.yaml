services:
  - type: web
    name: websec-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WEBSEC_ADMIN_USERNAME
        sync: false
      - key: WEBSEC_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: websec-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
